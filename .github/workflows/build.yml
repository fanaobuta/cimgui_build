name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install LuaJIT (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libluajit-5.1-dev

      - name: Install LuaJIT (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install luajit

      - name: Install LuaJIT (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          vcpkg install luajit:x64-windows
          echo "C:/vcpkg/installed/x64-windows/tools/luajit" >> $env:GITHUB_PATH
          echo "C:/vcpkg/installed/x64-windows/bin" >> $env:GITHUB_PATH

      - name: Download Submodules
        run: |
          git submodule update --init --recursive

      - name: Generate Bindings
        shell: bash
        run: |
          cd generator
          bash ./generator.sh

      - name: Configure CMake
        run: |
          cmake -B cmake-build -DCMAKE_BUILD_TYPE=Release -DCIMGUI_TEST=1

      - name: Build
        run: |
          cmake --build cmake-build --config Release

      - name: List Build Files
        shell: bash
        run: |
          find cmake-build

      - name: Run Tests (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          ./cmake-build/Release/cimgui_test.exe

      - name: Run Tests (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          ./cmake-build/cimgui_test

      # ================= WINDOWS =================

      - name: Upload Windows Build
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cimgui-windows
          path: |
            cmake-build/Release/*.dll
            cmake-build/Release/*.exe
            cmake-build/Release/*.lib

      # ================= LINUX =================

      - name: Upload Linux Build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cimgui-linux
          path: |
            cmake-build/*.so
            cmake-build/*.a

      # ================= MACOS =================

      - name: Upload macOS Build
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cimgui-macos
          path: |
            cmake-build/*.dylib
            cmake-build/*.a

